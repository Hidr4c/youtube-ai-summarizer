<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 128px;
      height: 128px;
      overflow: hidden;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-box {
      width: 120px;
      height: 120px;
      background: linear-gradient(145deg, #ff1a1a, #cc0000);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 8px 24px rgba(204, 0, 0, 0.45);
    }
    .play-arrow {
      width: 0;
      height: 0;
      border-top: 24px solid transparent;
      border-bottom: 24px solid transparent;
      border-left: 40px solid #ffffff;
      margin-left: 8px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
    }
    .sparkle {
      position: absolute;
      top: 14px;
      right: 14px;
      font-size: 24px;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3));
    }
  </style>
</head>
<body>
  <div class="icon-box">
    <div class="play-arrow"></div>
    <div class="sparkle">✨</div>
  </div>
</body>
</html>
