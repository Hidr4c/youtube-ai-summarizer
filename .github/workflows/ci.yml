name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Syntax & Automated Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile Extension Bundles
        run: npm run build

      - name: JavaScript Syntax & Integrity Check
        run: npm run check

      - name: Run Automated Test Suite & Coverage (>80%)
        run: npm run coverage

      - name: Verify Extension Package Structure
        run: |
          test -f manifest.json
          test -f dist/background.js
          test -f dist/content.js
          test -f dist/main_world.js
          test -f dist/popup.js
          test -f dist/content.css
          test -f dist/popup.html
          test -f dist/popup.css
          test -f src/content/content.css
          test -f src/popup/popup.html
          test -f src/popup/popup.css
          test -d icons
          test -f icons/icon128.png
          echo "All required extension files and dist bundles exist."
